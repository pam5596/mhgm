name: DevCI

on:
  push:
    branches: [ stg, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env: 
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRESS_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Nuxt
        run: npm install
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db

      - name: Setup DB
        run: npx prisma migrate dev
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db

      - name: Run Unit Vitest
        run: npm run test test/unit

      - name: Run Integration Vitest
        run: npm run test test/integration

      - name: Lint
        run: npm run lint
